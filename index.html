<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Futlyar — проверка видео</title>
<style>
  body { margin:0; background:#0b0f12; color:#f5f3ee; font:400 15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width: 880px; margin:0 auto; padding:32px 18px 64px; }
  h1 { font-size:20px; margin:0 0 4px; }
  p  { color:#98a0a6; font-size:14px; margin:0 0 22px; }
  video { display:block; width:100%; height:auto; border-radius:10px; background:#000; }
  .wide { margin-bottom:26px; }
  .tall { max-width:330px; }
  .cap { color:#6f767c; font:500 12px/1 ui-monospace,Consolas,monospace; margin:8px 0 0; }
</style>
</head>
<body>
<main>
  <h1>Проверка видео на телефоне</h1>
  <p>Если оба ролика играют сами, без нажатий — на сайте будет так же.</p>

  <div class="wide">
    <video src="Futlyar_Five_Hops_16x9.mp4" autoplay muted loop playsinline preload="metadata"></video>
    <p class="cap">16x9 · компьютер</p>
  </div>

  <div class="tall">
    <video src="Futlyar_Five_Hops_9x16.mp4" autoplay muted loop playsinline preload="metadata"></video>
    <p class="cap">9x16 · телефон</p>
  </div>
</main>
</body>
</html>
